[project]
name = "grocery-planner"
version = "0.0.1"
description = "Plans weekly grocery orders across Walmart and H-E-B curbside pickup"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
later = ["anthropic", "typer"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
