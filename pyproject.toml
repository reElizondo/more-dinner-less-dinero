[project]
name = "more-dinner-less-dinero"
version = "0.0.1"
description = "Plans weekly grocery orders across Walmart and H-E-B curbside pickup"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
later = ["anthropic", "typer"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
